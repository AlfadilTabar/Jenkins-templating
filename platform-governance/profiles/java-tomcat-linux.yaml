apiVersion: platform/v1
kind: Profile
metadata:
  name: java-tomcat-linux
  description: >-
    Java application (multi-JAR / WAR) deployed to external Apache Tomcat on
    Linux via Ansible. Build-Once-Deploy-Many: the artifact versions listed in
    the per-environment manifest are promoted dev -> uat -> prod unchanged.
  maintainer: platform-engineering
  os: linux
  executor: ansible

agent: linux-deploy

# Canonical golden-path stage sequence for this application TYPE.
# The generator renders one explicit stage() per entry. A descriptor may patch
# this list via steps.add / steps.remove, EXCEPT for stages marked locked:true,
# which the generator refuses to remove (mandatory gates).
stages:
  - id: checkout
    label: "Checkout & Load Manifest"
    step: platformCheckout

  - id: fetch
    label: "Fetch Artifacts from Nexus"
    step: platformFetch          # loops over deploy/<env>.yaml at runtime

  - id: validate
    label: "Validate Checksums & Manifest"
    step: platformValidate
    locked: true                 # mandatory - cannot be removed by a descriptor

  - id: approval
    label: "Deployment Approval"
    step: platformApproval
    gatedEnvs: [uat, prod]
    locked: true                 # mandatory change gate

  - id: deploy
    label: "Deploy to Tomcat"
    step: platformDeploy
    playbook: steps/ansible/deploy-java-tomcat.yml
    strategy: rolling
    locked: true

  - id: smokeTest
    label: "Smoke Test"
    step: platformSmokeTest

rollback:
  onFailure: true
  step: platformRollback
